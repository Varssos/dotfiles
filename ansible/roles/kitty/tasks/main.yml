---
- name: Remove existing kitty stow
  command:
    cmd: stow -D kitty
    chdir: "{{ dotfiles_path }}"
  ignore_errors: yes
  become_user: "{{ ansible_user_id }}"

- name: Install kitty terminal
  apt:
    name: kitty
    state: present

- name: Apply Catppuccin Mocha theme
  shell: 'kitty +kitten themes --reload-in=all Catppuccin-Mocha'
  become_user: "{{ ansible_user_id }}"
  ignore_errors: yes

- name: Create ~/.config/kitty directory
  file:
    path: "{{ lookup('env', 'HOME') }}/.config/kitty"
    state: directory
  become_user: "{{ ansible_user_id }}"

- name: Apply kitty stow
  command:
    cmd: stow kitty
    chdir: "{{ dotfiles_path }}"
  become_user: "{{ ansible_user_id }}"

- name: Check if kitty.conf exists
  stat:
    path: "{{ lookup('env', 'HOME') }}/.config/kitty/kitty.conf"
  register: kitty_conf_stat
  become_user: "{{ ansible_user_id }}"

- name: Create kitty.conf if it doesn't exist
  file:
    path: "{{ lookup('env', 'HOME') }}/.config/kitty/kitty.conf"
    state: touch
  when: not kitty_conf_stat.stat.exists
  become_user: "{{ ansible_user_id }}"

- name: Ensure kitty-private.conf is included
  lineinfile:
    path: "{{ lookup('env', 'HOME') }}/.config/kitty/kitty.conf"
    regexp: '^\s*#?\s*include\s+kitty-private\.conf'
    line: 'include kitty-private.conf'
    state: present
  become_user: "{{ ansible_user_id }}"

- name: Kitty configuration complete
  debug:
    msg: "Kitty configuration applied."
